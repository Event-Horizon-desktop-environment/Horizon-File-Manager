  <title>File manager icon, open folder</title>
  <desc>A deep navy semi-rounded tile holding an open folder. A bright cyan back folder with a tab holds a white sheet with gray text lines and red, green and blue tag dots. A frosted light blue front panel carries a navy terminal prompt chevron with a green cursor underscore.</desc>

