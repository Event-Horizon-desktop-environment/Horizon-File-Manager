<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 400 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>File manager icon, simplified</title>
  <desc>A complete semi-rounded blue square icon shaped like a file folder. A lighter blue tab at the top left flows into the body along a smooth S-curve. A plain white sheet peeks out above a frosted white-blue front panel with rounded top corners, which carries a large single-color navy terminal chevron and cursor underscore.</desc>

  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="400" height="400" rx="60"/>
    </clipPath>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c90f6"/>
      <stop offset="1" stop-color="#1060d2"/>
    </linearGradient>
    <linearGradient id="gTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6dbff"/>
      <stop offset="1" stop-color="#62b6ff"/>
    </linearGradient>
    <linearGradient id="gPanelShadow" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="182">
      <stop offset="0" stop-color="#06285a" stop-opacity="0"/>
      <stop offset="1" stop-color="#06285a" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eff9"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#bdd2f0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Folder body -->
    <rect x="0" y="0" width="400" height="400" fill="url(#gBody)"/>

    <!-- Tab: one soft shadow, lighter fill -->
    <path d="M160,21 C184,21 190,33 200,47 C210,61 218,79 244,79 H410" fill="none" stroke="#06285a" stroke-width="6" stroke-linecap="round" opacity="0.12"/>
    <path d="M-10,18 H160 C184,18 190,30 200,44 C210,58 218,76 244,76 H-10 Z" fill="url(#gTab)"/>

    <!-- Plain white sheet -->
    <rect x="26" y="108" width="348" height="98" rx="14" fill="url(#gPaper)"/>

    <!-- Soft fade shadow above the front panel -->
    <rect x="0" y="152" width="400" height="30" fill="url(#gPanelShadow)"/>

    <!-- Front panel -->
    <path d="M0,216 C0,196 14,182 34,182 H366 C386,182 400,196 400,216 V400 H0 Z" fill="url(#gFront)"/>
    <path d="M34,183.5 H366" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Terminal prompt, single color -->
    <path d="M138,244 L190,292 L138,340" fill="none" stroke="#0d4a9a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="216" y1="344" x2="284" y2="344" stroke="#0d4a9a" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Tile rim -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="58.5" fill="none" stroke="url(#gRim)" stroke-width="3"/>
</svg>
